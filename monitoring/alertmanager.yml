global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram
  routes:
    - match:
        severity: critical
      receiver: telegram
      repeat_interval: 1h

receivers:
  # bot_token comes from /etc/alertmanager/telegram_token, a host file that must
  # be created by hand - see the note in docker-compose.monitoring.yml for the
  # ownership it needs.
  #
  # chat_id below ships as 0 and MUST be edited on the host. A deploy workflow
  # used to sed it in from a TELEGRAM_ALERT_CHAT_ID secret; that workflow is
  # gone and nothing replaced it. Alertmanager starts and reports healthy with
  # chat_id 0, so a host that re-syncs this file from the repo without editing
  # it drops every alert silently. The marker comment is what that sed matched
  # and is kept only so an existing substitution stays recognisable.
  #
  # On the host. Anchored so that only the setting is rewritten and never these
  # comment lines - every loose form of this substitution, including one
  # addressed on the marker, also edits the example that documents it:
  #   sed -i 's/^\([[:space:]]*\)chat_id: 0\b/\1chat_id: <id>/' \
  #     /opt/bugspotter/monitoring/alertmanager.yml
  #   docker kill --signal=HUP bugspotter-alertmanager
  #
  # For local dev: set both to your own values, or skip the `monitoring`
  # compose profile if you don't need Telegram delivery.
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: 0  # __DEPLOY_SUBSTITUTES_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        # parse_mode is HTML, so any <, >, & in alertname/severity/summary/
        # description would break Telegram's strict HTML parser and the
        # message would be dropped. The `| html` pipe escapes them.
        # Summary/description come from the rule's annotations and are
        # identical across grouped alerts, so render them once from the
        # first alert and add a count if there are more, rather than
        # repeating the same block per instance.
        # {{ with }} and {{ end }} are kept inline with content so they
        # don't introduce stray blank lines in the Telegram output.
        message: |-
          {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname | html }}</b>
          Severity: {{ .CommonLabels.severity | html }}{{ if .Alerts }}{{ with index .Alerts 0 }}
          {{ .Annotations.summary | html }}
          {{ .Annotations.description | html }}{{ end }}{{ end }}{{ if gt (len .Alerts) 1 }}
          ({{ len .Alerts }} occurrences){{ end }}
