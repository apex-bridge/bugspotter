name: Impl Agent

# Phase 2 agent: fires when a human applies the `agent-working` label after
# ratifying the spec (Gate 1) and optionally an ADR (Gate 2).
# Reads the linked spec, calls Claude, opens a DRAFT PR with a scaffold.
# Gate 3 (merge) is human-held: the agent cannot merge.
#
# Model router (label-based):
#   complexity:high  -> claude-opus-4-8
#   pii-sensitive    -> claude-haiku-4-5-20251001
#   default          -> claude-sonnet-5
# The selected model is used on whichever LLM backend is active below.
#
# LLM backend is switchable via the LLM_BACKEND repo variable:
#   unset/"api" (default) — Messages API, billed per-token, needs
#     secrets.ANTHROPIC_API_KEY
#   "cli" — routes through the Claude Code CLI so usage draws from a Claude
#     subscription instead, needs secrets.CLAUDE_CODE_OAUTH_TOKEN (generate
#     with `claude setup-token`, requires Pro/Max/Team/Enterprise)
# Set with: gh variable set LLM_BACKEND --body cli   (or "api" to switch back)
#
# Required secrets: ANTHROPIC_API_KEY and/or CLAUDE_CODE_OAUTH_TOKEN
# ADR: docs/adr/0042-agent-identity-scoped-app.md

on:
  issues:
    types: [labeled]

concurrency:
  group: impl-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scaffold:
    name: Generate implementation scaffold
    if: github.event.label.name == 'agent-working'
    runs-on: ubuntu-latest
    # Must exceed the "Generate scaffold" step budget (21m) plus everything
    # around it, or a slow-but-successful generation gets killed after paying
    # for the model call. Measured on run 30149093922 (the last fully green
    # run): ~17s of setup before the step, ~64s for scope check + install +
    # build + prettier + eslint + commit/push (which runs the pre-push unit
    # suite) + PR + comment after it, ~1.5m total. Raised 25m -> 28m alongside
    # the step's 18m -> 21m (issue #365) to keep roughly the same ~5-6m
    # margin this job has always carried, not let it thin out to nothing.
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Claude Code CLI
        if: vars.LLM_BACKEND == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch linked spec (required)
        id: spec
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Spec file lives on main at docs/specs/0NNN-*.md (zero-padded 4 digits).
          # The spec is already checked out — no API call needed.
          PADDED=$(printf '%04d' "${ISSUE_NUMBER}")
          SPEC_FILE=$(ls "docs/specs/${PADDED}-"*.md 2>/dev/null | head -1) || true
          if [ -z "$SPEC_FILE" ] || [ ! -f "$SPEC_FILE" ]; then
            echo "::error::No spec file found at docs/specs/${PADDED}-*.md. Ratify a spec (Gate 1) before running the impl agent."
            exit 1
          fi
          DELIM="EOF_SPEC_$(openssl rand -hex 8)"
          echo "spec_content<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat "$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"

      - name: Generate scaffold
        id: gen
        # 21m, under the job's 28m cap. Raised from 15m to 18m alongside
        # generate-impl.mjs's CLI timeout (600s -> 780s): a real run on
        # issue #237 took 9m08s and another timed out at exactly 10m, so the
        # old budget had no useful margin. Raised again 18m -> 21m alongside
        # 780s -> 1140s (issue #365): three identical timeouts on issue #353,
        # each killed mid-way through a second extended-thinking pass that
        # never got room to finish.
        timeout-minutes: 21
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          SPEC_CONTENT: ${{ steps.spec.outputs.spec_content }}
          # Model router overrides — set via GitHub repo variables (no code change needed).
          # Unset = fall back to hardcoded defaults in generate-impl.mjs.
          IMPL_MODEL_HIGH: ${{ vars.IMPL_MODEL_HIGH }}
          IMPL_MODEL_DEFAULT: ${{ vars.IMPL_MODEL_DEFAULT }}
          IMPL_MODEL_LOW: ${{ vars.IMPL_MODEL_LOW }}
          # llm-client.mjs writes the CLI's full raw stdout/stderr here on any
          # failure (timeout, non-zero exit, malformed envelope) - never on
          # success. formatCliTimeout's own error message clips to 1500 chars
          # to keep this log readable, which is exactly what makes a real
          # post-mortem impossible from the step log alone (2026-08-14, issue
          # #227: a thinking-token count jump in the final 60s the clipped
          # tail alone couldn't explain). The "Upload CLI transcript on
          # failure" step below attaches the full file as a build artifact -
          # issue #365 (2026-08-19) used exactly that artifact to explain
          # #227's jump: it's Claude's extended-thinking signature field
          # (100K+ chars, emitted atomically once a thinking block completes,
          # not streamed), not a stall or a loop.
          AI_SDLC_CLI_TRANSCRIPT_PATH: ${{ github.workspace }}/cli-transcript-impl.log
        run: node scripts/ai-sdlc/generate-impl.mjs

      # `always()`, not `failure()`: llm-client.mjs writes this file whenever
      # its own call rejects, but a caller can swallow that rejection and
      # still exit 0 (verify-spec.mjs does exactly this on purpose - see
      # spec-agent.yml). Tying the upload to this step's own pass/fail would
      # silently miss those cases. if-no-files-found: ignore makes the normal
      # (no failure, no file) case a no-op instead of an error.
      # .log, not .ndjson: dumpCliTranscriptOnFailure wraps the raw stdout in
      # human-readable "=== stdout/stderr ===" headers and appends stderr, so
      # the file as a whole is not valid NDJSON even though stdout itself is.
      - name: Upload CLI transcript if one was written
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-transcript-impl-issue-${{ github.event.issue.number }}
          path: cli-transcript-impl.log
          if-no-files-found: ignore
          retention-days: 14

      # Hard gate, always: the scaffold's file list and the ratified spec's
      # "Files touched" list must match EXACTLY - no file written that the
      # spec never declared, and no file declared that the scaffold never
      # wrote. An unambiguous comparison, not a judgment call - unlike
      # check-spec-scope.mjs's cap check, which stays soft specifically in
      # this workflow (spec-agent.yml runs its own hard copy against the PR
      # instead; see that script's header). FILES_WRITTEN is passed even
      # when empty: an empty value means the scaffold wrote nothing, which
      # the gate must fail rather than skip.
      - name: Check impl scope against spec
        env:
          SPEC_FILE: ${{ steps.spec.outputs.spec_file }}
          FILES_WRITTEN: ${{ steps.gen.outputs.files_written }}
          IMPL_SUMMARY: ${{ steps.gen.outputs.impl_summary }}
        run: node scripts/ai-sdlc/check-impl-scope.mjs

      - name: Install dependencies (required for ESLint)
        run: pnpm install --frozen-lockfile

      # Installing deps activates Husky's prepare script, which wires up the
      # pre-push hook — it fires on the `git push` in "Commit scaffold to
      # branch" below and runs the backend test suite. That suite imports
      # internal workspace packages (@bugspotter/types, @bugspotter/utils,
      # @bugspotter/message-broker, ...) whose package.json points `main` at a `dist/`
      # that doesn't exist until they're built; without this, the push step
      # fails on an unrelated module-resolution error in the pre-push hook,
      # after the scaffold itself was already generated successfully. Using
      # the same root `build` script (`pnpm --filter "./packages/*" build`)
      # as everywhere else keeps this from silently missing a package if one
      # is added later.
      - name: Build workspace packages (required by pre-push test hook)
        run: pnpm build

      - name: Format generated files
        env:
          FILES_WRITTEN: ${{ steps.gen.outputs.files_written }}
        run: |
          printf '%s' "$FILES_WRITTEN" | tr ',' '\n' | while IFS= read -r f; do
            [ -n "$f" ] && npx prettier@3.6.2 --write --ignore-unknown "$f"
          done

      - name: Lint-fix generated TypeScript files
        env:
          FILES_WRITTEN: ${{ steps.gen.outputs.files_written }}
        run: |
          printf '%s' "$FILES_WRITTEN" | tr ',' '\n' | while IFS= read -r f; do
            if [[ "$f" =~ \.(ts|tsx|js|mjs)$ ]]; then
              pnpm exec eslint --fix -- "$f" || true
            fi
          done

      - name: Commit scaffold to branch
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          FILES_WRITTEN: ${{ steps.gen.outputs.files_written }}
          MODEL_USED: ${{ steps.gen.outputs.model_used }}
        run: |
          SLUG=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-40)
          BRANCH="impl/issue-${ISSUE_NUMBER}-${SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # stage only generated files — use -- to prevent path-as-option injection
          while IFS= read -r f; do
            [ -n "$f" ] && git add -- "$f"
          done < <(printf '%s' "$FILES_WRITTEN" | tr ',' '\n')
          MSG="$(printf 'impl(#%s): scaffold\n\nAssisted-by: %s (agent)' "$ISSUE_NUMBER" "$MODEL_USED")"
          git commit -m "$MSG"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.push.outputs.branch }}
          MODEL_USED: ${{ steps.gen.outputs.model_used }}
          IMPL_SUMMARY: ${{ steps.gen.outputs.impl_summary }}
        run: |
          PR_BODY="$(printf 'Agent-generated scaffold for issue #%s (model: %s).\n\n%s\n\nReview, fill in TODO sections, run tests, and merge when ready (Gate 3).\n\nRefs #%s\n\nAssisted-by: %s (agent)' \
            "$ISSUE_NUMBER" "$MODEL_USED" "$IMPL_SUMMARY" "$ISSUE_NUMBER" "$MODEL_USED")"

          PR_URL=$(gh pr create \
            --title "impl(#${ISSUE_NUMBER}): ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --draft \
            --head "$BRANCH" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          MODEL_USED: ${{ steps.gen.outputs.model_used }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "Scaffold drafted (${MODEL_USED}): ${PR_URL}. Review TODO sections, run tests, and merge when ready."
