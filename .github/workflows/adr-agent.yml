name: ADR Agent

# Phase 1 agent: fires when a human applies the `needs-adr` label.
# Calls Claude to draft an ADR in docs/adr/ and opens a DRAFT PR.
# Gate 2 (ADR ratification) is human-held: the agent cannot merge.
#
# If a linked spec PR exists, its content is passed to the agent for context.
#
# LLM backend is switchable via the LLM_BACKEND repo variable:
#   unset/"api" (default) — Messages API, billed per-token, needs
#     secrets.ANTHROPIC_API_KEY
#   "cli" — routes through the Claude Code CLI so usage draws from a Claude
#     subscription instead, needs secrets.CLAUDE_CODE_OAUTH_TOKEN (generate
#     with `claude setup-token`, requires Pro/Max/Team/Enterprise)
# Set with: gh variable set LLM_BACKEND --body cli   (or "api" to switch back)
#
# Required secrets: ANTHROPIC_API_KEY and/or CLAUDE_CODE_OAUTH_TOKEN
# ADR: docs/adr/0042-agent-identity-scoped-app.md

on:
  issues:
    types: [labeled]

concurrency:
  group: adr-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-adr:
    name: Draft ADR
    if: github.event.label.name == 'needs-adr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: vars.LLM_BACKEND == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch linked spec (if any)
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Look for a merged spec PR that references this issue
          SPEC_PR=$(gh pr list --state merged --search "spec(#${ISSUE_NUMBER})" --json number,files --jq \
            '[.[] | select(.files[].path | startswith("docs/specs/")) | .number] | first // empty')
          if [ -n "$SPEC_PR" ]; then
            SPEC_FILE=$(gh pr view "$SPEC_PR" --json files --jq \
              '.files[] | select(.path | startswith("docs/specs/")) | .path' | head -1)
            if [ -n "$SPEC_FILE" ] && [ -f "$SPEC_FILE" ]; then
              DELIM="EOF_$(openssl rand -hex 8)"
              { echo "spec_content<<$DELIM"; cat "$SPEC_FILE"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate ADR
        id: gen
        # 6m > generate-adr.mjs's own 300s (5m) LLM timeout, so the script's
        # error wins over a silent step kill. One LLM call in this job, so the
        # 15m job cap has ample room around it.
        timeout-minutes: 6
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          # generate-adr.mjs never passes an explicit model to callClaude(),
          # so CLI_MODEL (this) is its real effective default - without this
          # mapping, setting the repo variable would silently do nothing,
          # since a GitHub Actions variable only reaches process.env via an
          # explicit env: entry like this one, never automatically.
          LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SPEC_CONTENT: ${{ steps.spec.outputs.spec_content }}
          # llm-client.mjs writes the CLI's full raw stdout/stderr here on any
          # failed call (never on success) - the "Upload CLI transcript"
          # step below attaches it as a build artifact.
          AI_SDLC_CLI_TRANSCRIPT_PATH: ${{ github.workspace }}/cli-transcript-adr.log
        run: node scripts/ai-sdlc/generate-adr.mjs

      # `always()`: llm-client.mjs writes this file whenever its own call
      # rejects, independent of whether the surrounding script exits 0 or
      # not. if-no-files-found: ignore makes the normal case a no-op.
      # .log, not .ndjson: dumpCliTranscriptOnFailure wraps the raw stdout in
      # human-readable "=== stdout/stderr ===" headers and appends stderr, so
      # the file as a whole is not valid NDJSON even though stdout itself is.
      - name: Upload CLI transcript if one was written
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-transcript-adr-issue-${{ github.event.issue.number }}
          path: cli-transcript-adr.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Format generated files
        env:
          ADR_FILE: ${{ steps.gen.outputs.adr_file }}
        run: npx prettier@3.6.2 --write "$ADR_FILE"

      - name: Commit ADR to branch
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADR_FILE: ${{ steps.gen.outputs.adr_file }}
          ADR_SLUG: ${{ steps.gen.outputs.adr_slug }}
          ADR_NUMBER: ${{ steps.gen.outputs.adr_number }}
          # The model generate-adr.mjs actually used (LLM_DEFAULT_MODEL's
          # resolved value, not a second hardcoded literal here that would
          # silently go stale the moment that override is set).
          MODEL: ${{ steps.gen.outputs.model }}
        run: |
          BRANCH="adr/${ADR_NUMBER}-${ADR_SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$ADR_FILE"
          MSG="$(printf 'docs(adr): ADR-%s draft (%s)\n\nAssisted-by: %s (agent)' "$ADR_NUMBER" "$ADR_SLUG" "$MODEL")"
          git commit -m "$MSG"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.push.outputs.branch }}
          ADR_NUMBER: ${{ steps.gen.outputs.adr_number }}
          MODEL: ${{ steps.gen.outputs.model }}
        run: |
          PR_BODY="$(printf 'Agent-drafted ADR-%s for issue #%s.\n\nReview, promote Status to Accepted if correct, and merge to advance this issue to `agent-working`.\n\nRefs #%s\n\nAssisted-by: %s (agent)' "$ADR_NUMBER" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$MODEL")"

          PR_URL=$(gh pr create \
            --title "docs(adr): ADR-${ADR_NUMBER} ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --draft \
            --head "$BRANCH" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          ADR_NUMBER: ${{ steps.gen.outputs.adr_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "ADR-${ADR_NUMBER} drafted: $PR_URL. Review, promote Status to Accepted, and merge to advance to \`agent-working\`."
