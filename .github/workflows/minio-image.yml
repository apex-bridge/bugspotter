# Builds the MinIO server + mc image from upstream source
# (docker/minio/Dockerfile) and publishes it to ghcr.io. The Dockerfile header
# explains why: upstream no longer publishes pullable images.
#
# Tags are immutable. The tag is <MINIO_RELEASE>-r<IMAGE_REVISION> from the
# Dockerfile. If ghcr.io already has it, nothing is pushed, and the job fails
# unless the published image was built from the same docker/minio/ contents
# (io.bugspotter.context.sha256 label) - a change without a revision bump, or
# two branches claiming the same revision, is caught instead of passing.
#
# Runs on push to any branch that touches the image, so a revision bump can be
# published and exercised by CI before merge. Only repo writers can push
# branches here (fork PRs do not trigger `push`), the same trust boundary as
# pushing to main.
#
# CI and testcontainers pull this image without logging in, so the package
# must be public; the job checks an anonymous pull at the end.

name: MinIO image

on:
  push:
    paths:
      - 'docker/minio/**'
      - '.github/workflows/minio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Per ref: a shared group would let GitHub drop one branch's queued publish
# when another branch's run arrives.
concurrency:
  group: minio-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/minio

jobs:
  build:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read versions and hash the build context
        id: v
        run: |
          arg() { sed -n "s/^ARG $1=//p" docker/minio/Dockerfile; }
          minio=$(arg MINIO_RELEASE)
          rev=$(arg IMAGE_REVISION)
          if [ -z "$minio" ] || [ -z "$rev" ]; then
            echo "::error::MINIO_RELEASE / IMAGE_REVISION missing in docker/minio/Dockerfile"
            exit 1
          fi
          ctx=$(cd docker/minio && find . -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          {
            echo "tag=$IMAGE:$minio-r$rev"
            echo "context_sha256=$ctx"
          } >> "$GITHUB_OUTPUT"
          echo "tag $IMAGE:$minio-r$rev, context sha256 $ctx"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag is already published
        id: exists
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CTX: ${{ steps.v.outputs.context_sha256 }}
        run: |
          # Only a confirmed not-found allows a push; any other error is retried
          # and then fails the job, so a registry hiccup can never let us push
          # over an existing tag.
          state=
          for attempt in 1 2 3; do
            if out=$(docker buildx imagetools inspect "$TAG" 2>&1); then state=exists; break; fi
            if printf '%s\n' "$out" | grep -qiE 'not found|manifest unknown'; then state=missing; break; fi
            echo "Inspect attempt $attempt failed:"
            printf '%s\n' "$out"
            sleep 10
          done
          case "$state" in
            missing)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is not published yet"
              ;;
            exists)
              docker pull -q --platform linux/amd64 "$TAG" >/dev/null
              got=$(docker image inspect -f '{{ index .Config.Labels "io.bugspotter.context.sha256" }}' "$TAG")
              if [ "$got" != "$CTX" ]; then
                echo "::error::$TAG is already published from different docker/minio/ contents (label '$got', checkout '$CTX'). Bump IMAGE_REVISION in docker/minio/Dockerfile and update the references (node scripts/check-minio-image-tag.mjs lists them)."
                exit 1
              fi
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published from these sources; not pushing"
              ;;
            *)
              echo "::error::Could not determine whether $TAG exists; not publishing"
              exit 1
              ;;
          esac

      - name: Build linux/amd64 for the smoke test
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64
          load: true
          tags: minio-smoke:local
          build-args: CONTEXT_SHA256=${{ steps.v.outputs.context_sha256 }}
          cache-from: type=gha,scope=minio-image
          cache-to: type=gha,scope=minio-image,mode=max

      - name: Smoke test the local build
        if: steps.exists.outputs.exists == 'false'
        run: sh docker/minio/smoke-test.sh minio-smoke:local linux/amd64

      - name: Build and push linux/amd64 + linux/arm64
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tag }}
          build-args: CONTEXT_SHA256=${{ steps.v.outputs.context_sha256 }}
          cache-from: type=gha,scope=minio-image
          cache-to: type=gha,scope=minio-image,mode=max

      - name: Smoke test the published image (amd64 + arm64)
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          docker logout ghcr.io
          # Anonymous pull first: CI and testcontainers pull without credentials.
          for p in linux/amd64 linux/arm64; do
            if ! docker pull -q --platform "$p" "$TAG" >/dev/null; then
              echo "::error::$TAG ($p) is not publicly pullable. An org admin must set the package visibility to Public: https://github.com/orgs/apex-bridge/packages/container/package/bugspotter%2Fminio (Package settings > Change visibility)."
              exit 1
            fi
          done
          sh docker/minio/smoke-test.sh "$TAG" linux/amd64
          sh docker/minio/smoke-test.sh "$TAG" linux/arm64
