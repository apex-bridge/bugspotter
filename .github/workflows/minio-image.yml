# Builds the MinIO server + mc image from upstream source
# (docker/minio/Dockerfile) and publishes it to ghcr.io. The Dockerfile header
# explains why: upstream no longer publishes pullable images.
#
# Tags are immutable. The tag is <MINIO_RELEASE>-r<IMAGE_REVISION> from the
# Dockerfile, and the image records io.bugspotter.context.sha256: a hash of the
# Dockerfile with comment and blank lines removed (the build context has no
# other inputs; smoke-test.sh is not part of the image). If the tag already
# exists, nothing is pushed, and the job fails unless that hash matches - a
# Dockerfile change without a revision bump is caught instead of passing.
# Runs for the same tag are serialized (concurrency keyed on the tag), so two
# branches claiming one revision cannot both see "missing" and both push; the
# second one fails the hash check.
#
# Runs on push to any branch that touches the image, so a revision bump can be
# published and exercised by CI before merge. That means any repo writer can
# publish a tag from a branch: the same trust as pushing to main, which has no
# branch protection today. If main gets protected, restrict publishing to main
# (and stage PR images under a separate tag) to keep that guarantee.
#
# CI and testcontainers pull this image without logging in, so the package
# must be public; the job checks an anonymous pull at the end.

name: MinIO image

on:
  push:
    paths:
      - 'docker/minio/**'
      - '.github/workflows/minio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/minio

jobs:
  versions:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      context_sha256: ${{ steps.v.outputs.context_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read versions and hash the Dockerfile
        id: v
        run: |
          f=docker/minio/Dockerfile
          arg() { sed -n "s/^ARG $1=//p" "$f"; }
          minio=$(arg MINIO_RELEASE)
          rev=$(arg IMAGE_REVISION)
          if [ -z "$minio" ] || [ -z "$rev" ]; then
            echo "::error::MINIO_RELEASE / IMAGE_REVISION missing in $f"
            exit 1
          fi
          # Keep the `# syntax=` parser directive; drop other comments and blank
          # lines so documentation edits do not force a new tag.
          ctx=$({ grep -E '^# syntax=' "$f"; grep -vE '^[[:space:]]*(#|$)' "$f"; } | sha256sum | cut -d' ' -f1)
          {
            echo "tag=$IMAGE:$minio-r$rev"
            echo "context_sha256=$ctx"
          } >> "$GITHUB_OUTPUT"
          echo "tag $IMAGE:$minio-r$rev, Dockerfile sha256 $ctx"

  build:
    name: Build, smoke-test and publish
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Keyed on the tag, not the ref: serializes every run that could publish
    # this tag, whichever branch it comes from.
    concurrency:
      group: minio-image-${{ needs.versions.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.versions.outputs.tag }}
      CTX: ${{ needs.versions.outputs.context_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag is already published
        id: exists
        run: |
          # Only a confirmed not-found allows a push; any other error is retried
          # and then fails the job, so a registry hiccup can never let us push
          # over an existing tag.
          state=
          for attempt in 1 2 3; do
            if out=$(docker buildx imagetools inspect "$TAG" 2>&1); then state=exists; break; fi
            if printf '%s\n' "$out" | grep -qiE 'not found|manifest unknown'; then state=missing; break; fi
            echo "Inspect attempt $attempt failed:"
            printf '%s\n' "$out"
            sleep 10
          done
          case "$state" in
            missing)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is not published yet"
              ;;
            exists)
              docker pull -q --platform linux/amd64 "$TAG" >/dev/null
              got=$(docker image inspect -f '{{ index .Config.Labels "io.bugspotter.context.sha256" }}' "$TAG")
              if [ "$got" != "$CTX" ]; then
                echo "::error::$TAG is already published from a different Dockerfile (label '$got', checkout '$CTX'). Bump IMAGE_REVISION in docker/minio/Dockerfile and update the references (node scripts/check-minio-image-tag.mjs lists them)."
                exit 1
              fi
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published from this Dockerfile; not rebuilding"
              ;;
            *)
              echo "::error::Could not determine whether $TAG exists; not publishing"
              exit 1
              ;;
          esac

      - name: Build linux/amd64 for the smoke test
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64
          load: true
          tags: minio-smoke:local
          build-args: CONTEXT_SHA256=${{ env.CTX }}
          cache-from: type=gha,scope=minio-image
          cache-to: type=gha,scope=minio-image,mode=max

      - name: Smoke test the local build
        if: steps.exists.outputs.exists == 'false'
        run: sh docker/minio/smoke-test.sh minio-smoke:local linux/amd64

      - name: Build and push linux/amd64 + linux/arm64
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAG }}
          build-args: CONTEXT_SHA256=${{ env.CTX }}
          cache-from: type=gha,scope=minio-image
          cache-to: type=gha,scope=minio-image,mode=max

      - name: Smoke test the published image (amd64 + arm64, anonymous pull)
        if: steps.exists.outputs.exists == 'false'
        run: |
          docker logout ghcr.io
          # smoke-test.sh pulls each platform itself, now without credentials.
          sh docker/minio/smoke-test.sh "$TAG" linux/amd64
          sh docker/minio/smoke-test.sh "$TAG" linux/arm64

      - name: Check the image is publicly pullable
        if: always() && steps.exists.outcome == 'success'
        run: |
          docker logout ghcr.io
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "Anonymous pull of $TAG works"
          else
            echo "::error::$TAG is not publicly pullable. An org admin must set the package visibility to Public: https://github.com/orgs/apex-bridge/packages/container/package/bugspotter%2Fminio (Package settings > Change visibility)."
            exit 1
          fi
