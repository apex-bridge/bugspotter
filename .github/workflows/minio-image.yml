# Builds the MinIO server + mc image from upstream source
# (docker/minio/Dockerfile) and publishes it to ghcr.io. The Dockerfile header
# explains why: upstream no longer publishes pullable images.
#
# Tags are immutable. The tag is <MINIO_RELEASE>-r<IMAGE_REVISION> from the
# Dockerfile; if ghcr.io already has it, the job still builds and smoke-tests
# but does not push. A version or revision bump produces a new tag.
#
# Runs on push to any branch that touches the image, so a version bump can be
# published and exercised by CI before merge. Only repo writers can push
# branches here (fork PRs do not trigger `push`), the same trust boundary as
# pushing to main.
#
# CI and testcontainers pull this image without logging in, so the package
# must be public. The last step fails if an anonymous pull is refused.

name: MinIO image

on:
  push:
    paths:
      - 'docker/minio/**'
      - '.github/workflows/minio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: minio-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/minio

jobs:
  build:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read versions from Dockerfile
        id: v
        run: |
          arg() { sed -n "s/^ARG $1=//p" docker/minio/Dockerfile; }
          minio=$(arg MINIO_RELEASE); minio_commit=$(arg MINIO_COMMIT)
          mc=$(arg MC_RELEASE); mc_commit=$(arg MC_COMMIT)
          rev=$(arg IMAGE_REVISION)
          for v in "$minio" "$minio_commit" "$mc" "$mc_commit" "$rev"; do
            if [ -z "$v" ]; then
              echo "::error::A version ARG is missing in docker/minio/Dockerfile"
              exit 1
            fi
          done
          {
            echo "minio=$minio"
            echo "minio_commit=$minio_commit"
            echo "mc=$mc"
            echo "mc_commit=$mc_commit"
            echo "tag=$IMAGE:$minio-r$rev"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag is already published
        id: exists
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Only a confirmed not-found allows a push; any other error is retried
          # and then fails the job, so a registry hiccup can never let us push
          # over an existing tag.
          for attempt in 1 2 3; do
            if out=$(docker buildx imagetools inspect "$TAG" 2>&1); then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG is already published; it will be smoke-tested but not pushed"
              exit 0
            fi
            if printf '%s\n' "$out" | grep -qiE 'not found|manifest unknown'; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is not published yet"
              exit 0
            fi
            echo "Inspect attempt $attempt failed:"
            printf '%s\n' "$out"
            sleep 10
          done
          echo "::error::Could not determine whether $TAG exists; not publishing"
          exit 1

      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64
          load: true
          tags: minio-smoke:local
          cache-from: type=gha,scope=minio-image
          cache-to: type=gha,scope=minio-image,mode=max

      - name: Smoke test
        env:
          MINIO_RELEASE: ${{ steps.v.outputs.minio }}
          MINIO_COMMIT: ${{ steps.v.outputs.minio_commit }}
          MC_RELEASE: ${{ steps.v.outputs.mc }}
          MC_COMMIT: ${{ steps.v.outputs.mc_commit }}
        run: |
          set -eu
          # First line must equal the official binaries' exactly, e.g.
          # "minio version RELEASE.2024-10-13T13-34-11Z (commit-id=d10bb7e...)".
          check_version() {
            got=$(docker run --rm --entrypoint "$1" minio-smoke:local --version | head -n1)
            want="$1 version $2 (commit-id=$3)"
            echo "$got"
            if [ "$got" != "$want" ]; then
              echo "::error::$1 --version is '$got', expected '$want'"
              exit 1
            fi
          }
          check_version minio "$MINIO_RELEASE" "$MINIO_COMMIT"
          check_version mc "$MC_RELEASE" "$MC_COMMIT"

          # Started the way the tests and compose start it: the command has no
          # leading `minio`, the entrypoint adds it.
          docker run -d --name minio-smoke \
            -e MINIO_ROOT_USER=smoke-admin -e MINIO_ROOT_PASSWORD=smoke-secret-key \
            minio-smoke:local server /data --console-address ':9001'
          ok=
          for _ in $(seq 1 30); do
            # Same probe as the docker-compose healthcheck.
            if docker exec minio-smoke curl -sf http://127.0.0.1:9000/minio/health/live; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then docker logs minio-smoke; exit 1; fi

          # Same mc calls as the tests, plus the admin API used by scripts/init-minio.sh.
          docker exec minio-smoke sh -c \
            'mc alias set local http://localhost:9000 smoke-admin smoke-secret-key && mc mb local/smoke --ignore-existing && mc admin info local'
          docker rm -f minio-smoke

      - name: Build and push linux/amd64 + linux/arm64
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: docker/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tag }}
          cache-from: type=gha,scope=minio-image

      - name: Check the image is publicly pullable
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          docker logout ghcr.io
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "Anonymous pull of $TAG works"
          else
            echo "::error::$TAG is not publicly pullable. An org admin must set the package visibility to Public: https://github.com/orgs/apex-bridge/packages/container/package/bugspotter%2Fminio (Package settings > Change visibility)."
            exit 1
          fi
