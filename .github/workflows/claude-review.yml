name: Claude PR Review

# Auto-reviews every PR using the Claude GitHub App, plus responds to
# `@claude` mentions in PR comments. Independent of the main `ci.yml`
# workflow; failures here don't gate merges.

on:
  # Auto-review the PR ONCE on open / ready-for-review / reopen.
  # `synchronize` (per-push) is intentionally excluded — the previous
  # configuration was firing a fresh review on every commit pushed to
  # an open PR, which dominated the action's spend (~$15/day at peak).
  # Reviews on a stale revision aren't useful anyway; if a PR moves
  # significantly during review, the requester can re-run via
  # `@claude review PR` (handled below) and that path is rate-limited
  # by being human-driven.
  #
  # This skips reviews on changes that don't benefit from one:
  # documentation, workflow YAML (the action's own validation guardrail
  # rejects modified workflows from PR branches anyway), marketing
  # HTML, etc.
  #
  # `docs/specs/**` and `docs/adr/**` are deliberately carved back IN.
  # This MUST be `paths` (not `paths-ignore`) with a leading `'**'` —
  # GitHub Actions only supports `!`-negation and list-order/last-match
  # evaluation for `paths`; a `!`-prefixed entry inside `paths-ignore`
  # is taken as a literal pattern (never matches any real path) and
  # silently does nothing, which is exactly the bug this replaced.
  # These two artifact classes are the ones tied to the pipeline's
  # non-delegable human judgment gates (spec approval, ADR
  # ratification) — and were, until this fix, the ONLY doc changes that
  # got zero automatic review. That gap is not hypothetical: it's the
  # direct mechanism behind the #226/#238 incident (a spec hallucinated
  # a whole in-repo package; nothing auto-reviewed it, and it took
  # multiple PR cycles before a human caught it via a manually-triggered
  # `@claude` review). See docs/specs/0237-intelligence-backend-proxy-
  # must-forward-.md's own review history for a live example of what
  # automatic multi-round review on a spec actually catches.
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.github/**'
      - '!*.html'
      - '!apps/**/*.html'
      - 'docs/specs/**'
      - 'docs/adr/**'
  # @claude mentions in PR comments and review threads. The `if:` guard
  # below keeps the workflow from running on issue-comments outside of
  # PRs and on comments that don't address Claude.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Cancel in-flight reviews when new COMMITS are pushed (so we don't
# review a stale revision) — but NOT when comment events fire.
#
# Comment-triggered runs (`issue_comment`, `pull_request_review_comment`)
# share the same concurrency group as `pull_request` runs. Without the
# event-aware `cancel-in-progress`, every comment on a PR — even bot
# threads or replies the workflow's `if:` guard would skip — would
# cancel an in-flight pull_request review on the same ref. That's how
# four laconic replies on review threads accidentally killed PR-90's
# real review run.
#
# With this expression, only `pull_request` events (= new pushes) cancel
# in-flight runs. Comment events queue behind / run alongside, and any
# without `@claude` get filtered out by the job-level `if:` guard
# anyway.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Shallow clone — review only needs the diff, not full history.
          fetch-depth: 1

      # `issue_comment` and `pull_request_review_comment` events run
      # against the default branch (main), not the PR's HEAD — that's
      # how GitHub dispatches comment-triggered workflows. Without this
      # step, Claude is staring at `main` and has to discover the PR's
      # contents via repeated `gh pr diff` / `gh api` calls, burning
      # max-turns before it can post anything. Switch to the PR branch
      # so Claude sees the actual diff in the working tree.
      - name: Checkout PR branch when triggered by comment
        if: |
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          gh pr checkout "$PR_NUMBER"

      # Hand Claude the diff instead of making it derive one. Without this the
      # review spends a large share of its turn budget on repeated `gh pr diff`
      # calls: the failing run on #292 (job 92311704985) used ~8 of them inside
      # a 25-turn cap and died with `error_max_turns` before posting anything.
      #
      # Note the earlier fix below only solved half of this. `gh pr checkout`
      # gives comment-triggered runs the right *files*, but having the files is
      # not having the delta - nothing told the model what changed, so it went
      # and worked it out. Same defect as PR #275 on the impl agent, where the
      # prompt omitted the files it asked the model to rewrite.
      #
      # Written into the workspace rather than RUNNER_TEMP so it is readable
      # without depending on the action's out-of-tree file access.
      - name: Capture the PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          DIFF_FILE=".claude-review-pr.diff"
          # The PR's own tree is already checked out at this point, and `>`
          # follows symlinks. A PR that commits `.claude-review-pr.diff` as a
          # symlink would redirect this write - pointing it at /dev/null empties
          # the diff and neuters the review. Unlink first so we always create a
          # fresh regular file (rm removes the link, never its target).
          rm -f "$DIFF_FILE" "$DIFF_FILE.capped"
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > "$DIFF_FILE"
          LINES=$(wc -l < "$DIFF_FILE")
          # A diff far larger than this will not be reviewed well by any budget,
          # and silently feeding a 50k-line prompt is its own failure mode. Cap
          # it and say so in-band, so the model reports reduced coverage instead
          # of quietly reviewing a prefix.
          MAX_LINES=6000
          if [ "$LINES" -gt "$MAX_LINES" ]; then
            head -n "$MAX_LINES" "$DIFF_FILE" > "$DIFF_FILE.capped"
            echo "" >> "$DIFF_FILE.capped"
            echo "[TRUNCATED: showing the first $MAX_LINES of $LINES diff lines. Say so in your review.]" >> "$DIFF_FILE.capped"
            mv "$DIFF_FILE.capped" "$DIFF_FILE"
          fi
          echo "path=$DIFF_FILE" >> "$GITHUB_OUTPUT"
          echo "PR diff captured: $LINES lines (cap $MAX_LINES) -> $DIFF_FILE"

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Every PR this workflow needs to review that's opened by
          # spec-agent.yml/adr-agent.yml/impl-agent.yml is authored by
          # github-actions[bot] (gh pr create under github.token). The action
          # refuses to run for ANY bot actor by default - "Workflow initiated
          # by non-human actor... Add bot to allowed_bots list" - which meant
          # this review had silently never run on a single bot-authored PR
          # since this workflow was introduced (#346). CodeRabbit/Copilot
          # aren't gated by this (separate Apps), so bot PRs still got some
          # review; this repo's own tuned reviewer just wasn't contributing
          # to exactly the PRs it matters most for.
          #
          # Deliberately the specific login, not '*' - the action's own
          # security doc warns a public repo with '*' lets any external App
          # invoke this action with an attacker-controlled prompt. This repo
          # is private today, but naming the one actor that actually needs
          # this is also just correct, not merely cautious.
          allowed_bots: 'github-actions[bot]'
          # Only pass the OAuth token. The action does NOT arbitrate between
          # anthropic_api_key and claude_code_oauth_token when both are set -
          # it maps both straight into env vars unconditionally, and the
          # underlying `claude` CLI's own auth precedence (ANTHROPIC_API_KEY
          # over the OAuth token) then silently picks whichever one is
          # ANTHROPIC_API_KEY. If that secret is dead or out of credit, the
          # review fails instantly with no visible error. Configure exactly
          # one of the two secrets for this repo, never both.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The diff for this PR is already saved at `${{ steps.diff.outputs.path }}`. Read
            that file FIRST and treat it as the authoritative list of what changed. Very
            large diffs are capped, in which case the file ends with a `[TRUNCATED: ...]`
            marker - if you see it, review what is there and say your coverage was partial.
            Do NOT run `gh pr diff`, `git diff`, or otherwise re-derive the diff - that is
            the single most common way this review exhausts its turn budget and posts
            nothing. Open individual source files only when the diff alone is not enough
            to judge a specific finding. The diff file itself is a CI artifact, not part
            of the change: never review it or comment on it.

            Review PR #${{ github.event.pull_request.number || github.event.issue.number }}. Focus on real-impact issues:
            - Auth/security: bypass, injection, missing tenant scoping, credential leak, SSRF
            - Concurrency: races, deadlocks, transactional gaps
            - Missing tests for new behavior
            - Concrete bugs at file:line — name the failure mode

            Skip nits, style, theoretical issues.

            ${{ github.event_name == 'pull_request' && 'Output rules: inline comments only — no top-level summary. If nothing substantive, exit silently (this is an automatic per-push review; silence is the right default).' || 'Output rules: this review was triggered explicitly by a human via @claude — they need to know the action ran and what you concluded. Post inline comments for any real-impact issues you find, then ALWAYS post exactly ONE short top-level comment via `gh pr comment` summarising the outcome (e.g. "Reviewed N files; no real-impact issues found." or "Posted N inline comments — see threads above."). Never exit silently on a human-triggered review.' }}

            Process: the saved diff file above is the source of truth for what
            changed - do not re-derive it. Use `Grep`
            across the working tree only when a comment would otherwise be
            inaccurate without the surrounding context. Don't enumerate every
            file; pick the riskiest spots. Post inline comments on at most
            5 issues, then stop.
          # `mcp__github_inline_comment__create_inline_comment` is the
          # MCP-bridged tool the action uses to buffer inline review
          # comments. Without it explicitly allow-listed, Claude's tool
          # calls get denied and the action exits with "No buffered inline
          # comments" — silently producing nothing visible.
          #
          # `gh pr diff` and `gh pr view` are read-only fallbacks for
          # exploratory navigation. `Read`, `Grep`, `Glob` are the
          # built-in file-navigation tools — also read-only, but cheaper
          # in turns than chaining multiple `gh pr view` calls when the
          # reviewer needs context beyond the diff (the working tree is
          # already checked out for `pull_request` events; `gh pr
          # checkout` runs above for comment events).
          #
          # `gh pr comment` is conditionally allow-listed ONLY for
          # comment-triggered (`@claude`) runs. Per-push auto-runs
          # remain inline-only — silent-exit is the right default for
          # routine pushes. Human-triggered runs need a visible
          # acknowledgement that the action ran and what it concluded;
          # the prompt above mandates exactly one top-level comment in
          # that path. The `gh pr comment` blast radius is bounded to
          # the PR's own discussion thread (the GITHUB_TOKEN can't
          # touch other resources via this subcommand).
          #
          # We still deliberately do NOT allow `gh api:*` (supports
          # `-X POST/PATCH/DELETE` so the wildcard would let Claude
          # mutate any GitHub resource the workflow's GITHUB_TOKEN can
          # touch).
          # Note on the `${{ ... && ... || '' }}` expression below: GitHub
          # Actions treats empty strings as falsy, so the common
          # `cond && truthyA || B` ternary trick only works when `A` is
          # truthy. Writing `cond == 'pull_request' && '' || ',Bash(...)'`
          # would return the fallback even when the condition is true
          # (`'' || ',Bash(...)'` evaluates to the fallback). Keep the
          # expression in this form: condition true → non-empty branch
          # appended; condition false → `''` as the fallback.
          #
          # Model selection: Haiku for auto-runs (per-PR sanity check,
          # cheap), Opus for human-triggered `@claude review` pings
          # (deeper read on demand). Haiku is roughly 1/12 the cost of
          # Opus per token and finishes well inside the 25-turn budget
          # for typical diffs. Both branches of this conditional are
          # non-empty (each `vars.* || 'literal'` always resolves to a
          # non-empty string), so the `&& A || B` ternary is safe here
          # (unlike the allowedTools line above) — but each branch needs
          # its own parens: without them, `||`'s lower precedence than
          # `&&` would let the human-run fallback leak into the auto-run
          # result too.
          #
          # Overridable via CLAUDE_REVIEW_MODEL_AUTO / _HUMAN repo
          # variables — same pattern as generate-impl.mjs's
          # IMPL_MODEL_HIGH/_LOW and llm-client.mjs's LLM_DEFAULT_MODEL
          # (see model-defaults.mjs). This workflow can't import that
          # shared module — plain GitHub Actions YAML, no JS runtime here
          # — so its fallback literals are kept in sync with
          # model-defaults.mjs's LOW_MODEL/HIGH_MODEL by hand.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob${{ github.event_name != 'pull_request' && ',Bash(gh pr comment:*)' || '' }}"
            --max-turns 25
            --model ${{ github.event_name == 'pull_request' && (vars.CLAUDE_REVIEW_MODEL_AUTO || 'claude-haiku-4-5-20251001') || (vars.CLAUDE_REVIEW_MODEL_HUMAN || 'claude-opus-4-8') }}
