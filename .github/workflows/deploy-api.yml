name: Deploy API

# Workflow for independent Backend API deployments
# Triggers when backend or its dependency packages change, enabling faster
# deployments without requiring full admin CI to pass.

on:
  push:
    branches: [main]
    paths:
      # Must stay in step with the COPY inputs of packages/backend/Dockerfile -
      # see the note in deploy-admin.yml for what a missing path costs.
      - 'packages/backend/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'packages/billing/**'
      - 'packages/message-broker/**'
      - 'pnpm-lock.yaml' # Dependency resolution is baked at build time
      - 'pnpm-workspace.yaml'
      - 'package.json' # Root manifest, COPYd for the workspace install
      - '.npmrc'
      - 'tsconfig.json' # Root config the package tsconfigs extend
      - '.dockerignore' # Shapes the build context; see deploy-admin.yml
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (faster deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ==========================================================================
  # Lint Backend
  # ==========================================================================
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend code
        run: pnpm --filter @bugspotter/backend lint

      - name: Check formatting
        run: pnpm format:check

  # ==========================================================================
  # Test Backend
  # ==========================================================================
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    timeout-minutes: 15

    env:
      NODE_OPTIONS: --no-node-snapshot
      ENCRYPTION_KEY: ci_test_encryption_key_${{ github.run_id }}_${{ github.run_attempt }}_padding_to_ensure_min_length

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with native build tools
        uses: ./.github/actions/setup-node-native
        with:
          node-version: '22'
          pnpm-version: '9.14.4'

      - name: Build types package
        run: pnpm --filter @bugspotter/types build

      - name: Build utils package
        run: pnpm --filter @bugspotter/utils build

      - name: Build message-broker package
        run: pnpm --filter @bugspotter/message-broker build

      - name: Build billing package
        run: pnpm --filter @bugspotter/billing build

      - name: Run unit tests
        run: pnpm --filter @bugspotter/backend test:unit

      - name: Run API tests
        run: pnpm --filter @bugspotter/backend test -- tests/api

      - name: Run service tests
        run: pnpm --filter @bugspotter/backend test -- tests/services

      - name: Run database tests
        run: pnpm --filter @bugspotter/backend test -- tests/db

      - name: Run queue tests
        run: pnpm --filter @bugspotter/backend test -- tests/queue

      - name: Run retention tests
        run: pnpm --filter @bugspotter/backend test -- tests/retention

      - name: Run integration tests
        run: pnpm --filter @bugspotter/backend test -- tests/integrations

      - name: Run saas tests
        run: pnpm --filter @bugspotter/backend test -- tests/saas

  # ==========================================================================
  # Build API
  # ==========================================================================
  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to Staging
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || 
       github.event.inputs.environment == 'staging' ||
       github.event.inputs.environment == 'production')
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying API to staging"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

      # There is no staging environment. Production (see the job below) is a
      # single Docker Compose host - see RUNBOOK.md. A second host for staging
      # has never been provisioned; this job exists (kept for the
      # workflow_dispatch environment choice, and to gate deploy-production
      # via `needs:`) but has nothing to deploy to. Wiring a fake deploy step
      # here would either target the SAME production host under a misleading
      # label, or silently no-op - the exact "fired, passed, protected
      # nothing" shape #318 exists to fix, not repeat.
      - name: ℹ️ No staging environment
        run: |
          echo "::notice::There is no staging host - production is a single Docker Compose VM (see RUNBOOK.md)."
          echo "::notice::This job intentionally deploys nothing. See deploy-production for the real deploy step."

      - name: Verify deployment health
        if: vars.STAGING_API_URL != ''
        run: |
          echo "Checking staging API health..."
          for i in {1..15}; do
            if curl -sf "${{ vars.STAGING_API_URL }}/ready" > /dev/null 2>&1; then
              echo "✅ Staging API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/15)"
            sleep 10
          done
          echo "❌ Health check timed out - deployment failed or not responding"
          exit 1

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, deploy-staging]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.deploy-staging.result == 'success' &&
      github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying API to production"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

      # SSH to the single production host and recreate `api` + `worker` from
      # the image this run just pushed - pinned to the run's sha tag, never
      # `latest`, so "deployed" and "the health check below passed" refer to
      # the same build. Mirrors the manual procedure in RUNBOOK.md: pull,
      # retag :latest (keeping the previous tag for instant rollback), then
      # `compose up -d --no-build` both services that share the image.
      #
      # `api` and `worker` MUST be recreated together - they share one image,
      # and rebuilding it without recreating both leaves them on different
      # code (found the hard way during the first manual deploy this
      # replaces, see RUNBOOK.md).
      #
      # Known gap vs #318's stated acceptance bar: this verifies the deployed
      # container answers healthy, not that its image digest equals the one
      # this run pushed - /ready exposes no build identifier yet. Tracked,
      # not silently declared done.
      - name: Deploy to production host
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > "$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"

          echo "Deploying $IMAGE_REF to $DEPLOY_HOST"
          ssh -i "$RUNNER_TEMP/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              set -euo pipefail
              echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin
              docker pull '$IMAGE_REF'
              docker tag bugspotter-api:latest bugspotter-api:pre-${{ github.sha }} || true
              docker tag '$IMAGE_REF' bugspotter-api:latest
              cd /opt/bugspotter
              docker compose up -d --no-build api worker
            "

      - name: Verify deployment health
        if: vars.PRODUCTION_API_URL != ''
        run: |
          echo "Checking production API health..."
          for i in {1..15}; do
            if curl -sf "${{ vars.PRODUCTION_API_URL }}/ready" > /dev/null 2>&1; then
              echo "✅ Production API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/15)"
            sleep 10
          done
          echo "❌ Health check timed out - deployment failed or not responding"
          exit 1

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## API Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || needs.test.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result == 'success' && '✅' || needs.deploy-staging.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-production.result == 'success' && '✅' || needs.deploy-production.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.outputs.image_digest }}" != "" ]; then
            echo "### Image Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Digest**: \`${{ needs.build.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          fi
