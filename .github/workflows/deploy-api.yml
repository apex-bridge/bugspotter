name: Deploy API

# Workflow for independent Backend API deployments
# Triggers when backend or its dependency packages change, enabling faster
# deployments without requiring full admin CI to pass.

on:
  push:
    branches: [main]
    paths:
      # Must stay in step with the COPY inputs of packages/backend/Dockerfile -
      # see the note in deploy-admin.yml for what a missing path costs.
      - 'packages/backend/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'packages/billing/**'
      - 'packages/message-broker/**'
      - 'pnpm-lock.yaml' # Dependency resolution is baked at build time
      - 'pnpm-workspace.yaml'
      - 'package.json' # Root manifest, COPYd for the workspace install
      - '.npmrc'
      - 'tsconfig.json' # Root config the package tsconfigs extend
      - '.dockerignore' # Shapes the build context; see deploy-admin.yml
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (faster deploy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ==========================================================================
  # Lint Backend
  # ==========================================================================
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend code
        run: pnpm --filter @bugspotter/backend lint

      - name: Check formatting
        run: pnpm format:check

  # ==========================================================================
  # Test Backend
  # ==========================================================================
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [lint]
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    timeout-minutes: 15

    env:
      NODE_OPTIONS: --no-node-snapshot
      ENCRYPTION_KEY: ci_test_encryption_key_${{ github.run_id }}_${{ github.run_attempt }}_padding_to_ensure_min_length

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with native build tools
        uses: ./.github/actions/setup-node-native
        with:
          node-version: '22'
          pnpm-version: '9.14.4'

      - name: Build types package
        run: pnpm --filter @bugspotter/types build

      - name: Build utils package
        run: pnpm --filter @bugspotter/utils build

      - name: Build message-broker package
        run: pnpm --filter @bugspotter/message-broker build

      - name: Build billing package
        run: pnpm --filter @bugspotter/billing build

      - name: Run unit tests
        run: pnpm --filter @bugspotter/backend test:unit

      - name: Run API tests
        run: pnpm --filter @bugspotter/backend test -- tests/api

      - name: Run service tests
        run: pnpm --filter @bugspotter/backend test -- tests/services

      - name: Run database tests
        run: pnpm --filter @bugspotter/backend test -- tests/db

      - name: Run queue tests
        run: pnpm --filter @bugspotter/backend test -- tests/queue

      - name: Run retention tests
        run: pnpm --filter @bugspotter/backend test -- tests/retention

      - name: Run integration tests
        run: pnpm --filter @bugspotter/backend test -- tests/integrations

      - name: Run saas tests
        run: pnpm --filter @bugspotter/backend test -- tests/saas

  # ==========================================================================
  # Build API
  # ==========================================================================
  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: [lint]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to Staging
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || 
       github.event.inputs.environment == 'staging' ||
       github.event.inputs.environment == 'production')
    environment:
      name: staging
      url: ${{ vars.STAGING_API_URL }}

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying API to staging"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

      # There is no staging environment. Production (see the job below) is a
      # single Docker Compose host - see RUNBOOK.md. A second host for staging
      # has never been provisioned; this job exists (kept for the
      # workflow_dispatch environment choice, and to gate deploy-production
      # via `needs:`) but has nothing to deploy to. Wiring a fake deploy step
      # here would either target the SAME production host under a misleading
      # label, or silently no-op - the exact "fired, passed, protected
      # nothing" shape #318 exists to fix, not repeat.
      - name: ℹ️ No staging environment
        run: |
          echo "::notice::There is no staging host - production is a single Docker Compose VM (see RUNBOOK.md)."
          echo "::notice::This job intentionally deploys nothing. See deploy-production for the real deploy step."

      - name: Verify deployment health
        if: vars.STAGING_API_URL != ''
        run: |
          echo "Checking staging API health..."
          for i in {1..15}; do
            if curl -sf "${{ vars.STAGING_API_URL }}/ready" > /dev/null 2>&1; then
              echo "✅ Staging API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/15)"
            sleep 10
          done
          echo "❌ Health check timed out - deployment failed or not responding"
          exit 1

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, deploy-staging]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.deploy-staging.result == 'success' &&
      github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}

    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Deploying API to production"
          echo "Image: ${{ needs.build.outputs.image_tag }}"
          echo "Digest: ${{ needs.build.outputs.image_digest }}"

      # SSH to the single production host as a dedicated `deploy` account
      # restricted by a forced SSH command (see DEPLOY-SECRETS-ROTATION.md) -
      # the key can run exactly one operation, not a shell. All this step
      # does is send the image ref as the "command"; the host-side script
      # validates it, pulls, retags :latest (keeping the previous tag for
      # instant rollback), and recreates `api` + `worker` - both, since they
      # share one image and rebuilding it without recreating both leaves them
      # on different code (found the hard way during the manual deploy this
      # replaces, see RUNBOOK.md). Pinned to the run's sha tag, never
      # `latest`, so "deployed" and "the health check below passed" refer to
      # the same build. GHCR packages here are public, so no registry login
      # is needed to pull.
      #
      # Known gap vs #318's stated acceptance bar: this verifies the deployed
      # container answers healthy, not that its image digest equals the one
      # this run pushed - /ready exposes no build identifier yet. Tracked,
      # not silently declared done.
      - name: Deploy to production host
        env:
          # docker/metadata-action's `type=sha` uses git's abbreviated (7-char)
          # sha by default - `github.sha` is the full 40-char sha, so
          # reconstructing the tag from it produces a ref that was never
          # pushed. Extract the real tag from the same output the build step
          # actually used, instead of a second, divergent computation of it.
          ALL_TAGS: ${{ needs.build.outputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Passed through env, not interpolated into the run: script text
          # below, so a secret value containing shell metacharacters can't
          # become shell syntax at execution time - the same injection shape
          # GitHub's hardening docs warn against for untrusted `run:` input.
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          # `|| true` matters: this shell runs with -e (GitHub Actions'
          # default), so a no-match grep inside the assignment would abort
          # the step right here and skip the message below.
          IMAGE_REF=$(printf '%s\n' "$ALL_TAGS" | grep -- ':sha-' || true)
          if [ -z "$IMAGE_REF" ]; then
            echo "::error::No sha-tagged image found in: $ALL_TAGS" >&2
            exit 1
          fi

          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

          echo "Deploying $IMAGE_REF to $DEPLOY_HOST"

          # Two things learned from review on the first version of this retry
          # loop - both real, both fixed here:
          #
          # 1. ssh's exit code 255 is NOT specific to connection-level
          #    failures - per its own documented contract, it is the generic
          #    "an error occurred client-side" code, also covering host-key
          #    verification failures and BatchMode auth failures. Blindly
          #    retrying on any 255 would also retry a genuinely broken
          #    SSH_KNOWN_HOSTS or a revoked deploy key, uselessly, before
          #    failing with a misleading "transient" message. Only retry when
          #    ssh's own output actually names a network-level failure.
          #
          # 2. Every attempt in this loop runs on the SAME runner - a GitHub
          #    Actions job never changes runners mid-execution - so they all
          #    share one source IP. The 2026-08-11 and 2026-08-22 incidents
          #    that motivated this loop were both resolved by a fresh
          #    `workflow_dispatch` (a NEW job, a NEW runner, a NEW IP), not
          #    by retrying within one job - if the cause is netcup's network
          #    edge dropping THIS runner's specific IP, retrying here just
          #    repeats the same failure. This loop still earns its keep for a
          #    genuine one-off blip unrelated to IP-based filtering, so it
          #    stays, bounded to one retry rather than pretending several
          #    attempts help - but the terminal error message says plainly
          #    that a fresh workflow re-run, not this loop, is the fix that
          #    has actually worked every time so far.
          # A third gap, also from review: the forced remote command (the
          # host-side deploy script - not tracked in this repo, see
          # RUNBOOK.md - so it can't be fixed by remapping its own exit
          # codes from here) can itself exit 255 and print output that
          # happens to contain one of these phrases (e.g. Docker/curl
          # commonly say "Connection refused" about a completely unrelated
          # local service). A bare substring match anywhere in the combined
          # output would misclassify that as a retryable SSH-level failure.
          # Anchored instead to ssh's own client-side diagnostic message
          # format ("ssh: connect to host HOST port PORT: reason" for
          # TCP-level failures, "ssh: Could not resolve hostname HOST:" for
          # DNS) - a line only ssh itself ever emits, and only when the
          # connection attempt failed before the remote command could run
          # at all, so there is no way for the remote script's own output
          # to produce it.
          # 2026-08-22, second attempt: the prefix-anchored pattern below
          # STILL failed to classify a real "ssh: connect to host X port 22:
          # Connection timed out" line as a network error - printed verbatim
          # by this same step, immediately before the misclassification.
          # Root cause not confirmed locally (every reproduction of the
          # exact byte sequence, with and without a trailing \r, with and
          # without a trailing newline on the captured variable, matched
          # correctly here) - possibly some difference in the actual
          # ubuntu-latest runner's captured bytes this local shell can't
          # reproduce. That attempt dropped the trailing `$` anchor entirely
          # and added a diagnostic byte dump, on the theory that removing
          # the anchor couldn't introduce a false positive on its own - true
          # in isolation, but review caught that this variable also carries
          # the forced remote command's own output (see above), so an
          # unanchored prefix match is reachable by more than just ssh's own
          # diagnostics. Third attempt: restored end-anchoring on both
          # alternatives, tolerant of an optional trailing `\r` (`\r?$`)
          # rather than the old bare `$`, since the runner's actual captured
          # bytes were never confirmed to be free of one. Also switched the
          # classification check from `grep -qE` to `grep -E ... >/dev/null`
          # - `-q` closes its stdin as soon as it finds a match, which can
          # make the writing end of the pipe (this `printf`) see SIGPIPE and
          # exit non-zero; under GitHub Actions' default `pipefail`, that
          # non-zero exit - not grep's own success - can become the
          # pipeline's reported status, so `grep -qE` can evaluate as "no
          # match" even when it matched. Not confirmed as the actual cause
          # of either incident (a local repro with pipefail on did not
          # reproduce it for this short a line) but it's a real gap with
          # zero downside to closing. Also expanded the diagnostic dump to
          # the full `od -c` output instead of the last 5 lines - the
          # previous truncation could cut off exactly the bytes a fourth
          # occurrence would need.
          MAX_ATTEMPTS=2
          ATTEMPT=1
          NETWORK_ERROR_PATTERN='^ssh: connect to host .* port [0-9]+: (Connection timed out|Connection refused|No route to host|Network is unreachable)\r?$|^ssh: Could not resolve hostname .*\r?$'
          while true; do
            if [ "$ATTEMPT" -gt 1 ]; then
              echo "Retry $ATTEMPT/$MAX_ATTEMPTS..."
            fi
            # `cmd || VAR=$?`, not `if cmd; then ... fi` followed by reading
            # `$?` - POSIX defines an if/fi with no branch taken (condition
            # false, no else) as exiting 0 itself, not the condition's own
            # exit status, so `$?` read after the fi would always be 0 and
            # this retry logic would never fire. `cmd || VAR=$?` is also
            # exempt from `set -e` (a command on the left of `||` never
            # triggers -e), so this still can't abort the step early either.
            # stdout+stderr captured together (2>&1 inside the substitution)
            # so the network-error check below can inspect ssh's own message
            # text, then printed as-is to preserve normal log visibility.
            SSH_EXIT=0
            SSH_OUTPUT=$(ssh -i "$RUNNER_TEMP/deploy_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$IMAGE_REF" 2>&1) || SSH_EXIT=$?
            printf '%s\n' "$SSH_OUTPUT"

            if [ "$SSH_EXIT" -eq 0 ]; then
              break
            fi

            IS_NETWORK_ERROR=false
            if [ "$SSH_EXIT" -eq 255 ] && printf '%s' "$SSH_OUTPUT" | grep -E "$NETWORK_ERROR_PATTERN" >/dev/null 2>&1; then
              IS_NETWORK_ERROR=true
            fi
            # Diagnostic for the next occurrence, not just this one: if this
            # ever misclassifies again, the raw bytes and the exact pattern
            # used are right here instead of requiring another guess. Plain
            # echo, not ::debug:: - debug annotations are hidden unless a
            # repo has step-debug logging explicitly enabled, and this needs
            # to be visible on a normal run.
            echo "Retry classification: SSH_EXIT=$SSH_EXIT IS_NETWORK_ERROR=$IS_NETWORK_ERROR"
            echo "Pattern used: $NETWORK_ERROR_PATTERN"
            printf '%s' "$SSH_OUTPUT" | od -c

            if [ "$IS_NETWORK_ERROR" = false ] || [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              if [ "$IS_NETWORK_ERROR" = true ]; then
                echo "::error::SSH deploy failed with a network-level error (exit 255) after $ATTEMPT attempt(s), same runner/IP each time. This matches netcup's known intermittent network-edge drop of a specific runner's source IP (seen 2026-08-11, 2026-08-22) - re-running this workflow (Actions -> Re-run jobs, or workflow_dispatch again) allocates a fresh runner with a different IP, which has resolved it every time so far." >&2
              else
                echo "::error::SSH deploy failed (exit $SSH_EXIT) - not a recognized network-level error, so not retrying (could mask a real problem, e.g. a stale SSH_KNOWN_HOSTS or revoked SSH_DEPLOY_KEY). Check the output above." >&2
              fi
              exit "$SSH_EXIT"
            fi

            echo "::warning::SSH network-level failure on attempt $ATTEMPT/$MAX_ATTEMPTS - retrying once on this same runner (same source IP) in case it's a one-off blip. If this is netcup's known IP-block pattern, this retry will likely fail the same way - a fresh workflow_dispatch (new runner, new IP) is the fix that has actually worked before. Retrying in 15s..."
            ATTEMPT=$((ATTEMPT + 1))
            sleep 15
          done

      - name: Verify deployment health
        if: vars.PRODUCTION_API_URL != ''
        run: |
          echo "Checking production API health..."
          for i in {1..15}; do
            if curl -sf "${{ vars.PRODUCTION_API_URL }}/ready" > /dev/null 2>&1; then
              echo "✅ Production API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/15)"
            sleep 10
          done
          echo "❌ Health check timed out - deployment failed or not responding"
          exit 1

  # ==========================================================================
  # Summary
  # ==========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [lint, build, test, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## API Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅' || needs.test.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result == 'success' && '✅' || needs.deploy-staging.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-production.result == 'success' && '✅' || needs.deploy-production.result == 'skipped' && '⏭️' || '❌' }} ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.outputs.image_digest }}" != "" ]; then
            echo "### Image Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Digest**: \`${{ needs.build.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          fi
