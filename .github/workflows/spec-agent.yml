name: Spec Agent

# Phase 1 agent: fires when a human applies the `needs-spec` label.
# Calls Claude to draft a spec from TEMPLATE.md and opens a DRAFT PR.
# Gate 1 (spec approval) is human-held: the agent cannot merge.
#
# LLM backend is switchable via the LLM_BACKEND repo variable:
#   unset/"api" (default) — Messages API, billed per-token, needs
#     secrets.ANTHROPIC_API_KEY
#   "cli" — routes through the Claude Code CLI so usage draws from a Claude
#     subscription instead, needs secrets.CLAUDE_CODE_OAUTH_TOKEN (generate
#     with `claude setup-token`, requires Pro/Max/Team/Enterprise)
# Set with: gh variable set LLM_BACKEND --body cli   (or "api" to switch back)
#
# Required secrets: ANTHROPIC_API_KEY and/or CLAUDE_CODE_OAUTH_TOKEN
# ADR: docs/adr/0042-agent-identity-scoped-app.md

on:
  issues:
    types: [labeled]

concurrency:
  group: spec-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-spec:
    name: Draft spec
    if: github.event.label.name == 'needs-spec'
    runs-on: ubuntu-latest
    # 28m. Was 22m (870s of model budget - generate-spec.mjs's 450s +
    # verify-spec.mjs's 420s - plus setup). Raised alongside the "Generate
    # spec" step's own timeout below: generate-spec.mjs can now make a second,
    # corrective LLM call when it detects a narrated-tool-call-transcript
    # response (see detect-narration.mjs and that script's own comment), and
    # the job cap has to have room for that second call too, not just the
    # first. 14m (gen, up from 8m) + 8m (verify, unchanged) = 22m of step
    # budget, plus the same ~6m of setup headroom the previous 22m/16m split
    # already assumed (checkout, setup-node, `npm install -g
    # @anthropic-ai/claude-code`, prettier, git push, two `gh` calls) = 28m.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: vars.LLM_BACKEND == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate spec
        id: gen
        # 14m. Was 8m (> generate-spec.mjs's own 450s/7.5m LLM timeout alone).
        # Raised so the script's own SPEC_STEP_BUDGET_MS-gated corrective
        # retry (see detect-narration.mjs and generate-spec.mjs's own
        # comment - fires only on a detected narrated-tool-call transcript,
        # the exact shape issue #355/#401 hit) has real room to run a second
        # ~450s call rather than being starved to near-zero budget the
        # instant the first call returns. generate-spec.mjs's own
        # SPEC_STEP_BUDGET_MS default (14m) must match this step's
        # timeout-minutes, or the script will think it has headroom this step
        # doesn't actually have.
        timeout-minutes: 14
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          # generate-spec.mjs never passes an explicit model to callClaude(),
          # so CLI_MODEL (this) is its real effective default - without this
          # mapping, setting the repo variable would silently do nothing,
          # since a GitHub Actions variable only reaches process.env via an
          # explicit env: entry like this one, never automatically.
          LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          # See "Upload CLI transcript(s) if any were written" below - the
          # full raw stdout/stderr llm-client.mjs saves on any failed call.
          AI_SDLC_CLI_TRANSCRIPT_PATH: ${{ github.workspace }}/cli-transcript-generate-spec.log
        run: node scripts/ai-sdlc/generate-spec.mjs

      - name: Verify and patch spec (adversarial factual check)
        # 8m > verify-spec.mjs's own 420s (7m) LLM timeout. Important here
        # specifically: verify-spec.mjs deliberately exits 0 on any error so a
        # verifier hiccup preserves the already-generated spec. A step kill
        # bypasses that design and loses the spec, so the cap must sit above
        # the script's own timeout, never below it.
        timeout-minutes: 8
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          # verify-spec.mjs also never passes an explicit model - same
          # CLI_MODEL default as the Generate spec step above.
          LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
          AI_SDLC_CLI_TRANSCRIPT_PATH: ${{ github.workspace }}/cli-transcript-verify-spec.log
        run: node scripts/ai-sdlc/verify-spec.mjs

      # `always()`, not `failure()`: verify-spec.mjs deliberately exits 0 on
      # its own LLM call failing (see above), so a transcript can exist even
      # though every step in this job reported success. if-no-files-found:
      # ignore makes the normal (no failure, no file) case a no-op. One
      # upload step covers both possible files via a glob.
      # .log, not .ndjson: dumpCliTranscriptOnFailure wraps the raw stdout in
      # human-readable "=== stdout/stderr ===" headers and appends stderr, so
      # the file as a whole is not valid NDJSON even though stdout itself is.
      - name: Upload CLI transcript(s) if any were written
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-transcript-spec-issue-${{ github.event.issue.number }}
          path: cli-transcript-*.log
          if-no-files-found: ignore
          retention-days: 14

      # Deterministic follow-up to the LLM pass above: no model call, no
      # attention/instruction-following failure mode. Fails the workflow
      # (not advisory) if the spec declares a new path colliding with a
      # component docs/adr/README.md attributes to a different repo - the
      # exact shape of the #226/#238 mistake.
      - name: Verify spec path ownership (deterministic)
        env:
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: node scripts/ai-sdlc/verify-spec-ownership.mjs

      # Deliberately kept soft here (SPEC_SCOPE_HARD unset) even though the
      # cap is a real hard gate elsewhere: an over-scoped agent-generated
      # spec should still produce a visible PR with a warning, rather than
      # failing this whole job with nothing to show for it - a silently
      # vanished generation run is worse than a PR a human has to react to.
      # ai-sdlc-guards.yml runs the hard copy of this same check against the
      # PR itself, where a reviewer will actually see it before merging.
      - name: Check spec scope (advisory)
        env:
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: node scripts/ai-sdlc/check-spec-scope.mjs

      - name: Format generated files
        env:
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: npx prettier@3.6.2 --write "$SPEC_FILE"

      - name: Commit spec to branch
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
          SPEC_SLUG: ${{ steps.gen.outputs.spec_slug }}
          # The model generate-spec.mjs actually used (LLM_DEFAULT_MODEL's
          # resolved value, not a second hardcoded literal here that would
          # silently go stale the moment that override is set).
          MODEL: ${{ steps.gen.outputs.model }}
        run: |
          BRANCH="spec/issue-${ISSUE_NUMBER}-${SPEC_SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$SPEC_FILE"
          MSG="$(printf 'spec(#%s): draft spec\n\nAssisted-by: %s (agent)' "$ISSUE_NUMBER" "$MODEL")"
          git commit -m "$MSG"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.push.outputs.branch }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
          MODEL: ${{ steps.gen.outputs.model }}
        run: |
          PR_BODY="$(printf 'Agent-drafted spec for issue #%s.\n\nReview, fill gaps, and merge to advance this issue to `needs-adr` (if an ADR is warranted) or `agent-working` (if no ADR is needed).\n\nRefs #%s\n\nAssisted-by: %s (agent)' "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$MODEL")"

          PR_URL=$(gh pr create \
            --title "spec(#${ISSUE_NUMBER}): ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --draft \
            --head "$BRANCH" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "Spec drafted: $PR_URL. Review and merge to advance to \`needs-adr\` or \`agent-working\`."
