name: Spec Agent

# Phase 1 agent: fires when a human applies the `needs-spec` label.
# Calls Claude to draft a spec from TEMPLATE.md and opens a DRAFT PR.
# Gate 1 (spec approval) is human-held: the agent cannot merge.
#
# LLM backend is switchable via the LLM_BACKEND repo variable:
#   unset/"api" (default) — Messages API, billed per-token, needs
#     secrets.ANTHROPIC_API_KEY
#   "cli" — routes through the Claude Code CLI so usage draws from a Claude
#     subscription instead, needs secrets.CLAUDE_CODE_OAUTH_TOKEN (generate
#     with `claude setup-token`, requires Pro/Max/Team/Enterprise)
# Set with: gh variable set LLM_BACKEND --body cli   (or "api" to switch back)
#
# Required secrets: ANTHROPIC_API_KEY and/or CLAUDE_CODE_OAUTH_TOKEN
# ADR: docs/adr/0042-agent-identity-scoped-app.md

on:
  issues:
    types: [labeled]

concurrency:
  group: spec-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-spec:
    name: Draft spec
    if: github.event.label.name == 'needs-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        if: vars.LLM_BACKEND == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate spec
        id: gen
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/ai-sdlc/generate-spec.mjs

      - name: Verify and patch spec (adversarial factual check)
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: node scripts/ai-sdlc/verify-spec.mjs

      # Deterministic follow-up to the LLM pass above: no model call, no
      # attention/instruction-following failure mode. Fails the workflow
      # (not advisory) if the spec declares a new path colliding with a
      # component docs/adr/README.md attributes to a different repo - the
      # exact shape of the #226/#238 mistake.
      - name: Verify spec path ownership (deterministic)
        env:
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: node scripts/ai-sdlc/verify-spec-ownership.mjs

      - name: Format generated files
        env:
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: npx prettier@3.6.2 --write "$SPEC_FILE"

      - name: Commit spec to branch
        id: push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
          SPEC_SLUG: ${{ steps.gen.outputs.spec_slug }}
        run: |
          BRANCH="spec/issue-${ISSUE_NUMBER}-${SPEC_SLUG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$SPEC_FILE"
          MSG="$(printf 'spec(#%s): draft spec\n\nAssisted-by: claude-sonnet-4-6 (agent)' "$ISSUE_NUMBER")"
          git commit -m "$MSG"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH: ${{ steps.push.outputs.branch }}
          SPEC_FILE: ${{ steps.gen.outputs.spec_file }}
        run: |
          PR_BODY="$(printf 'Agent-drafted spec for issue #%s.\n\nReview, fill gaps, and merge to advance this issue to `needs-adr` (if an ADR is warranted) or `agent-working` (if no ADR is needed).\n\nRefs #%s\n\nAssisted-by: claude-sonnet-4-6 (agent)' "$ISSUE_NUMBER" "$ISSUE_NUMBER")"

          PR_URL=$(gh pr create \
            --title "spec(#${ISSUE_NUMBER}): ${ISSUE_TITLE}" \
            --body "$PR_BODY" \
            --draft \
            --head "$BRANCH" \
            --base main)

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "Spec drafted: $PR_URL. Review and merge to advance to \`needs-adr\` or \`agent-working\`."
